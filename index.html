  // &#9472;&#9472; MAP DENSITY FILTER &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
  // Valor actual del filtro de densidad mínima del mapa (control deslizante en la barra superior).
  let currentMapDensity = 0;

  /**
   * onMapDensityChange() — Sincroniza el slider de densidad del mapa, actualiza currentMapDensity
   * y llama a updateAllMarkers() para ocultar/mostrar marcadores según el umbral elegido.
   * @param {number|string} val - Nuevo valor de densidad mínima (se parsea a float).
   */
  function onMapDensityChange(val) {
    currentMapDensity = parseFloat(val);
    const slider  = document.getElementById('map-density-slider');
    const valEl   = document.getElementById('map-density-val');
    const resetEl = document.getElementById('map-density-reset');
    if (slider)  slider.value = currentMapDensity;
    if (valEl)   valEl.innerHTML = currentMapDensity.toFixed(1) + ' <small style="font-weight:400;color:var(--gray-400)">&#237;/m&#178;</small>';
    if (resetEl) resetEl.style.display = currentMapDensity > 0 ? 'inline-block' : 'none';
    updateAllMarkers();
  }

  function beachHasBothPeriods(beach) {
    const years = new Set(beach.events.map(e => getEventYear(e.date)));
    return (years.has('2021')||years.has('2022')) && (years.has('2024')||years.has('2025'));
  }

  function getLitterForBeachPeriod(beach, period) {
    const evs = getEventsForPeriod(beach, period === 'all' ? 'all' : period);
    if (!evs.length) return {};
    const result = {};
    evs.forEach(e => { Object.entries(e.litter||{}).forEach(([k,v]) => { result[k] = (result[k]||0) + v; }); });
    return result;
  }

  function getDensityForBeachPeriod(beach, period) {
    const evs = getEventsForPeriod(beach, period === 'all' ? 'all' : period);
    if (!evs.length) return null;
    return evs.reduce((s,e) => s + (e.density||0), 0) / evs.length;
  }

  /**
   * getEventsForPeriod() — Filtra los eventos de una playa según el período activo.
   * @param {Object} beach  - Objeto playa de DATA.beaches.
   * @param {string} period - 'all' devuelve todos; '2021-2022' o '2024-2025' filtra por año.
   * @returns {Array} Array de eventos del período (puede ser vacío).
   */
  function getEventsForPeriod(beach, period) {
    if (period === 'all') return beach.events;
    const years = period === '2021-2022' ? ['2021','2022'] : ['2024','2025'];
    return beach.events.filter(e => years.includes(getEventYear(e.date)));
  }

  /**
   * getBeachDensityForPeriod() — Calcula la densidad media de basura (ítems/m²) de una playa
   * para el período indicado, promediando la densidad por área de cada evento.
   * @param {Object} beach  - Objeto playa de DATA.beaches.
   * @param {string} period - 'all' | '2021-2022' | '2024-2025'.
   * @returns {number|null} Densidad media, o null si no hay eventos en el período.
   */
  function getBeachDensityForPeriod(beach, period) {
    const events = getEventsForPeriod(beach, period);
    if (!events.length) return null;
    const sum = events.reduce((a, e) => a + e.density, 0);
    return sum / events.length;
  }

  function getBeachDensityForTypes(beach, period, types) {
    const events = getEventsForPeriod(beach, period);
    if (!events.length) return null;
    const densities = events.map(e => e.area > 0 ? types.reduce((s, t) => s + (e.litter[t] || 0), 0) / e.area : 0);
    return densities.reduce((a, d) => a + d, 0) / densities.length;
  }

  // ⚠️ CÓDIGO MUERTO: getLitterForPeriod no es llamada desde ningún lugar del código.
  // La función equivalente activa es getLitterForBeachPeriod() (que sí agrega todos los eventos).
  // ⚠️ BUG POTENCIAL: devuelve solo el litter del ÚLTIMO evento, no el acumulado del período.
  // Esto contradice el propósito esperado; debería iterar y agregar como getLitterForBeachPeriod.
  /**
   * getLitterForPeriod() — Devuelve el litter del último evento del período indicado.
   * @param {Object} beach  - Objeto playa de DATA.beaches.
   * @param {string} period - 'all' | '2021-2022' | '2024-2025'.
   * @returns {Object} Objeto litter del último evento, o {} si no hay eventos.
   */
  function getLitterForPeriod(beach, period) {
    const events = getEventsForPeriod(beach, period);
    if (!events.length) return {};
    return events[events.length - 1].litter;
  }

  // ────── POPUPS DEL MAPA ───────────────────────────────────────────────────
  /**
   * buildPopupHtml() — Construye el HTML del popup de Leaflet para una playa.
   * Dos modos de vista:
   *   • eventIndex = -1 (vista general): densidad promedio + donut agregado + gráfico temporal.
   *   • eventIndex ≥ 0 (vista de evento): datos de ese evento individual.
   * Incluye barra de navegación (‹ ›) con puntos de posición.
   * @param {Object} b          - Objeto playa de DATA.beaches.
   * @param {number} eventIndex - Índice del evento a mostrar, o -1 para vista general.
   * @returns {string} HTML listo para m.bindPopup() o m.setPopupContent().
   */
  function buildPopupHtml(b, eventIndex) {
    const events = getEventsForPeriod(b, currentPeriod);
    if (!events.length) return '';
    const total = events.length;
    const isGeneral = (eventIndex === -1) && total > 1;
    const e = isGeneral ? null : events[Math.max(eventIndex, 0)];
    const popupId = 'popup-chart-' + b.id;

    const prevIndex = isGeneral ? null : (eventIndex === 0 ? (total > 1 ? -1 : null) : eventIndex - 1);
    const nextIndex = isGeneral ? 0 : (eventIndex === total - 1 ? null : eventIndex + 1);

    // Page label: "RESUMEN" or "DD-MM-YYYY [n/total]"
    const pageLabel = isGeneral
      ? 'RESUMEN'
      : `${e.date} [${eventIndex + 1}/${total}]`;

    // Dots: one per page. General page only exists when total > 1
    const hasGeneral  = total > 1;
    const totalPages  = hasGeneral ? 1 + total : total;
    const currentPage = isGeneral ? 0 : (hasGeneral ? eventIndex + 1 : eventIndex);
    const dotsHtml = totalPages <= 1 ? '' : Array.from({length: totalPages}, (_,i) =>
      `<div class="bp-nav-dot${i === currentPage ? ' active' : ''}"></div>`
    ).join('');

    // Nav bar: only show if there's something to navigate
    const showNav = total > 1 || (total === 1 && false); // always show for consistency, hide dots if 1
    const navHtml = `
      <div class="bp-nav">
        <button class="bp-nav-btn" onclick="navigatePopup(${b.id}, ${prevIndex})"
          ${prevIndex === null ? 'disabled' : ''}>‹</button>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          <span class="bp-nav-label">${pageLabel}</span>
          ${dotsHtml ? `<div class="bp-nav-dots">${dotsHtml}</div>` : ''}
        </div>
        <button class="bp-nav-btn" onclick="navigatePopup(${b.id}, ${nextIndex})"
          ${nextIndex === null ? 'disabled' : ''}>›</button>
      </div>`;

    const headerHtml = `
      <div class="bp-title country" style="margin-top:2px">${decodeHTML(b.beach)}</div>
      <div class="bp-stat" style="color:#aaa;margin-bottom:6px">${b.country}${b.city ? ' &middot; ' + b.city : ''}</div>`;

    if (isGeneral) {
      const avgDensity = (events.reduce((a,ev) => a + ev.density, 0) / total).toFixed(3);
      const totalItems = events.reduce((s,ev) => s + (ev.total||0), 0);
      const temporalHtml = total > 1 ? `
        <div style="margin-top:6px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
            <span style="font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.3px">Evoluci&#243;n</span>
            <div style="display:flex;gap:2px">
              <button id="ptgl-gen-${b.id}" onclick="switchPopupTemporal(${b.id},'general')"
                style="padding:1px 7px;border:1px solid var(--gray-200);border-radius:10px;font-size:10px;cursor:pointer;background:var(--green);color:#fff">General</button>
              <button id="ptgl-cat-${b.id}" onclick="switchPopupTemporal(${b.id},'category')"
                style="padding:1px 7px;border:1px solid var(--gray-200);border-radius:10px;font-size:10px;cursor:pointer;background:var(--white);color:var(--gray-600)">Por categor&#237;a</button>
            </div>
          </div>
          <div style="height:80px;position:relative"><canvas id="popup-temporal-${b.id}"></canvas></div>
        </div>` : '';
      return `
        <div class="popup-inner">
          ${navHtml}
          <div style="padding:0 10px 10px">
            ${headerHtml}
            <div class="popup-density">${avgDensity}</div>
            <div class="popup-density-label">prom. &#237;tem/m&#178; &middot; ${total} monitoreo${total > 1 ? 's' : ''}</div>
            <div class="popup-total">${totalItems} &#237;tems en el per&#237;odo</div>
            <div class="popup-chart-wrap"><canvas id="${popupId}"></canvas></div>
            ${temporalHtml}
            <a class="bp-link" onclick="showBeachDetail(${b.id});return false;">Ver detalle de la playa &#8594;</a>
          </div>
        </div>`;
    } else {
      return `
        <div class="popup-inner">
          ${navHtml}
          <div style="padding:0 10px 10px">
            ${headerHtml}
            <div class="bp-stat">Densidad: <b style="color:var(--red)">${e.density!=null?(+e.density).toFixed(3):'—'}</b> &#237;tem/m&#178;</div>
            <div class="bp-stat">Total: <b>${e.total||0}</b> &#237;tems</div>
            ${e.org ? `<div class="bp-stat" style="font-style:italic;color:#bbb;font-size:10px">${e.org}</div>` : ''}
            <div class="popup-chart-wrap"><canvas id="${popupId}"></canvas></div>
            <a class="bp-link" onclick="showBeachDetail(${b.id});return false;">Ver detalle de la playa &#8594;</a>
          </div>
        </div>`;
    }
  }

  /**
   * navigatePopup() — Navega a una página del popup (evento individual o vista general).
   * Destruye los gráficos anteriores, reconstruye el HTML y, tras 50 ms, dibuja el nuevo
   * donut y —en vista general— el gráfico temporal de evolución.
   * @param {number} beachId  - ID de la playa.
   * @param {number} newIndex - Índice del evento destino, o -1 para vista general.
   */
  function navigatePopup(beachId, newIndex) {
    if (newIndex === null || newIndex === undefined) return;
    const b = DATA.beaches.find(x => x.id === beachId);
    const events = getEventsForPeriod(b, currentPeriod);
    if (newIndex !== -1 && (newIndex < 0 || newIndex >= events.length)) return;
    popupEventIndex[beachId] = newIndex;
    const m = markers[beachId];
    if (!m) return;
    destroyChart('popup-chart-' + beachId);
    destroyChart('popup-temporal-' + beachId);
    m.setPopupContent(buildPopupHtml(b, newIndex));
    setTimeout(() => {
      if (newIndex === -1) {
        // Vista general: donut agregado del periodo
        const litAgg = {};
        let totalArea = 0;
        events.forEach(ev => {
          Object.entries(ev.litter).forEach(([k,v]) => { litAgg[k] = (litAgg[k]||0) + v; });
          totalArea += (ev.area || 0);
        });
        makeDoughnut('popup-chart-' + beachId, Object.keys(litAgg), Object.values(litAgg), true, false, totalArea);
        renderPopupTemporal(beachId, events, 'general');
      } else {
        const e = events[newIndex];
        makeDoughnut('popup-chart-' + beachId, FIXED_8, FIXED_8.map(k => e.litter[k]||0), true, false, e.area);
      }
      m.openPopup();
    }, 50);
  }

  /**
   * renderPopupTemporal() — Dibuja el mini gráfico de línea de evolución temporal
   * en la vista general del popup (solo cuando hay ≥2 eventos).
   * Soporta dos modos: 'general' (densidad global) y 'category' (una línea por FIXED_8).
   * Los eventos se ordenan cronológicamente antes de renderizar.
   * @param {number} beachId - ID de la playa (para construir el canvasId).
   * @param {Array}  events  - Array de eventos del período activo.
   * @param {string} mode    - 'general' | 'category'.
   */
  function renderPopupTemporal(beachId, events, mode) {
    destroyChart('popup-temporal-' + beachId);
    const ctx = document.getElementById('popup-temporal-' + beachId);
    if (!ctx || events.length < 2) return;
    const evsSorted = [...events].sort((a, z) => {
      const p = d => d.split('-').reverse().join('');
      return p(a.date).localeCompare(p(z.date));
    });
    const labels = evsSorted.map(e => e.date);
    let datasets;
    if (mode === 'general') {
      datasets = [{
        data: evsSorted.map(e => e.density),
        borderColor: 'var(--green)',
        backgroundColor: 'rgba(46,125,50,0.08)',
        pointBackgroundColor: evsSorted.map(e => densityColor(e.density)),
        pointRadius: 3, borderWidth: 1.5, fill: true, tension: 0.3
      }];
    } else {
      const types = FIXED_8;
      const colors = ['#2E7D32','#F59E0B','#3B82F6','#EF4444','#8B5CF6','#EC4899','#14B8A6'];
      datasets = types.map((lt, i) => ({
        label: t(lt),
        data: evsSorted.map(e => e.litter[lt] || 0),
        borderColor: colors[i % colors.length],
        backgroundColor: 'transparent',
        pointRadius: 2, borderWidth: 1.5, tension: 0.3
      }));
    }
    charts['popup-temporal-' + beachId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true }
        },
        scales: {
          x: { ticks: { font: { size: 8 }, maxRotation: 30, maxTicksLimit: 5 }, grid: { display: false } },
          y: { ticks: { font: { size: 8 }, maxTicksLimit: 4 }, beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }
        }
      }
    });
  }

  /**
   * switchPopupTemporal() — Alterna el modo del gráfico temporal del popup entre
   * 'general' (densidad global) y 'category' (desglose por FIXED_8).
   * Actualiza el estilo visual de los botones toggle y llama a renderPopupTemporal().
   * @param {number} beachId - ID de la playa.
   * @param {string} mode    - 'general' | 'category'.
   */
  function switchPopupTemporal(beachId, mode) {
    const btnGen = document.getElementById('ptgl-gen-' + beachId);
    const btnCat = document.getElementById('ptgl-cat-' + beachId);
    if (btnGen) { btnGen.style.background = mode === 'general' ? 'var(--green)' : 'var(--white)'; btnGen.style.color = mode === 'general' ? '#fff' : 'var(--gray-600)'; }
    if (btnCat) { btnCat.style.background = mode === 'category' ? 'var(--green)' : 'var(--white)'; btnCat.style.color = mode === 'category' ? '#fff' : 'var(--gray-600)'; }
    const b = DATA.beaches.find(x => x.id === beachId);
    if (!b) return;
    renderPopupTemporal(beachId, getEventsForPeriod(b, currentPeriod), mode);
  }

  /**
   * updateAllMarkers() — Función central de actualización del mapa.
   * 1. Aplica los filtros globales (beachMatchesGlobalFilters) y el período activo.
   * 2. Actualiza los contadores del statsbar (países, playas, eventos, organizaciones).
   * 3. Retira todos los marcadores del mapa, luego los vuelve a agregar ordenados por densidad
   *    (menor densidad primero = las playas más contaminadas quedan encima visualmente).
   * 4. Actualiza color, radio y popup de cada marcador según el período y filtros actuales.
   */
  function updateAllMarkers() {
    // Filtrar playas según filtros globales
    const activePeriodBeaches = DATA.beaches.filter(b => beachMatchesGlobalFilters(b));
    const activePeriodEvents = activePeriodBeaches.flatMap(b => getEventsForPeriod(b, currentPeriod));
    const activeCountries = new Set(activePeriodBeaches.map(b => b.country)).size;
    const activeOrgs = new Set(activePeriodEvents.map(e => e.org)).size;

    document.querySelector('#mlm-statsbar .mlm-stat:nth-child(1) .mlm-stat-value').textContent = activeCountries;
    document.querySelector('#mlm-statsbar .mlm-stat:nth-child(2) .mlm-stat-value').textContent = activePeriodBeaches.length;
    document.querySelector('#mlm-statsbar .mlm-stat:nth-child(3) .mlm-stat-value').textContent = activePeriodEvents.length;
    document.querySelector('#mlm-statsbar .mlm-stat:nth-child(4) .mlm-stat-value').textContent = activeOrgs;

    // Remover todos los marcadores del mapa para reordenarlos
    DATA.beaches.forEach(b => { const m = markers[b.id]; if (m) m.remove(); });

    const _getDensity = (b) => currentLitterTypes.length
      ? getBeachDensityForTypes(b, currentPeriod, currentLitterTypes)
      : getBeachDensityForPeriod(b, currentPeriod);

    [...DATA.beaches].sort((a, b) => {
      const dA = _getDensity(a) || 0;
      const dB = _getDensity(b) || 0;
      return dA - dB;
    }).forEach(b => {
      const m = markers[b.id];
      if (!m) return;

      const density = _getDensity(b);

      // Ocultar si no cumple filtros globales o no tiene densidad
      if (density === null || !beachMatchesGlobalFilters(b)) {
        m.remove();
        return;
      }

      // Actualizar color y tamaño del círculo según el período
      m.setStyle({ fillColor: currentLitterTypes.length > 0 ? densityColorFiltered(density) : densityColor(density) });
      m.setRadius(densityRadius(density, getEventsForPeriod(b, currentPeriod).length));

      const evsPeriod = getEventsForPeriod(b, currentPeriod);
      popupEventIndex[b.id] = evsPeriod.length > 1 ? -1 : 0;
      m.bindPopup(buildPopupHtml(b, popupEventIndex[b.id]), { maxWidth: 230 });
      m.on('popupopen', () => {
        const evCount = getEventsForPeriod(b, currentPeriod).length;
        const idx = popupEventIndex[b.id] !== undefined ? popupEventIndex[b.id] : (evCount > 1 ? -1 : 0);
        const evs = getEventsForPeriod(b, currentPeriod);
        setTimeout(() => {
          if (idx === -1) {
            const litAgg = {};
            let totalArea = 0;
            evs.forEach(ev => { Object.entries(ev.litter).forEach(([k,v]) => { litAgg[k] = (litAgg[k]||0) + v; }); totalArea += (ev.area || 0); });
            makeDoughnut('popup-chart-' + b.id, Object.keys(litAgg), Object.values(litAgg), true, false, totalArea);
            renderPopupTemporal(b.id, evs, 'general');
          } else {
            const e = evs[idx];
            if (e) makeDoughnut('popup-chart-' + b.id, FIXED_8, FIXED_8.map(k => e.litter[k]||0), true, false, e.area);
          }
        }, 50);
      });
      m.on('popupclose', () => {
        destroyChart('popup-chart-' + b.id);
        destroyChart('popup-temporal-' + b.id);
      });

      m.addTo(map);
    });
  }

  // &#9472;&#9472; PERIOD FILTER &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;

  /**
   * getEventYear() — Extrae el año de una fecha de evento.
   * Maneja dos formatos: 'DD-MM-YYYY' (retorna parts[2]) y 'YYYY-MM-DD' (retorna parts[0]).
   * @param {string} dateStr - Fecha del evento en formato DD-MM-YYYY o YYYY-MM-DD.
   * @returns {string} Año como string de 4 dígitos.
   */
  function getEventYear(dateStr) {
    const parts = dateStr.split('-');
    return parts[2] && parts[2].length === 4 ? parts[2] : parts[0];
  }

  // ⚠️ CÓDIGO MUERTO: beachMatchesPeriod no es llamada desde ningún lugar del código.
  // Su lógica está incrustada en beachMatchesGlobalFilters() y getEventsForPeriod().
  /**
   * beachMatchesPeriod() — Indica si una playa tiene al menos un evento en el período.
   * @param {Object} beach  - Objeto playa de DATA.beaches.
   * @param {string} period - 'all' | '2021-2022' | '2024-2025'.
   * @returns {boolean} true si la playa tiene eventos en el período dado.
   */
  function beachMatchesPeriod(beach, period) {
    if (period === 'all') return true;
    const years = period === '2021-2022' ? ['2021','2022'] : ['2024','2025'];
    return beach.events.some(e => years.includes(getEventYear(e.date)));
  }

  /**
   * togglePeriod() — Activa o desactiva un período desde su botón pill (2021 | 2024).
   * Sincroniza todos los botones con el mismo data-period. Impide desactivar el último
   * período activo. Actualiza currentPeriod, refresca marcadores, boxplots y listas.
   * Si había un popup abierto, lo reconstruye con los eventos del nuevo período.
   * @param {HTMLElement} btn - Botón .period-btn que disparó el evento onclick.
   */
  function togglePeriod(btn) {
    // Sync all period buttons (panel + any other)
    const allBtns = document.querySelectorAll('.period-btn');
    const thisPeriod = btn.dataset.period;

    // Toggle this button
    const activeBtns = [...allBtns].filter(b => b.dataset.period === thisPeriod && b.classList.contains('active'));
    const totalActive = [...document.querySelectorAll('#mlm-sidebar .period-btn')].filter(b => b.classList.contains('active'));

    // No permitir desactivar si es el ultimo activo
    if (totalActive.length === 1 && activeBtns.length > 0) return;

    // Toggle all buttons with same period
    allBtns.forEach(b => { if (b.dataset.period === thisPeriod) b.classList.toggle('active'); });

    const newActive = [...document.querySelectorAll('#mlm-sidebar .period-btn')].filter(b => b.classList.contains('active'));
    currentPeriod = newActive.length === 2 ? 'all' : newActive[0]?.dataset.period || 'all';
    currentFilters.period = currentPeriod;

    updateFilterBadge();

    const openMarker = Object.entries(markers).find(([id, m]) => m.isPopupOpen());
    const openBeachId = openMarker ? parseInt(openMarker[0]) : null;

    updateAllMarkers();

    if (openBeachId) {
      const m = markers[openBeachId];
      const b = DATA.beaches.find(x => x.id === openBeachId);
      const evs = getEventsForPeriod(b, currentPeriod);
      if (!evs.length) {
        m.closePopup();
      } else {
        const idx = evs.length > 1 ? -1 : 0;
        popupEventIndex[b.id] = idx;
        destroyChart('popup-chart-' + openBeachId);
        destroyChart('popup-temporal-' + openBeachId);
        m.setPopupContent(buildPopupHtml(b, idx));
        m.openPopup();
        setTimeout(() => {
          if (idx === -1) {
            const litAgg = {};
            let totalArea = 0;
            evs.forEach(ev => { Object.entries(ev.litter).forEach(([k,v]) => { litAgg[k] = (litAgg[k]||0) + v; }); totalArea += (ev.area || 0); });
            makeDoughnut('popup-chart-' + openBeachId, Object.keys(litAgg), Object.values(litAgg), true, false, totalArea);
            renderPopupTemporal(openBeachId, evs, 'general');
          } else {
            makeDoughnut('popup-chart-' + openBeachId, FIXED_8, FIXED_8.map(k => evs[0].litter[k]||0), true, false, evs[0].area);
          }
        }, 200);
      }
    }

    renderCountries();
    if (document.getElementById('beaches-tbody')) filterBeaches();
    if (currentBeachId && document.getElementById('view-beach-detail').classList.contains('active')) {
      showBeachDetail(currentBeachId, true);
    }
    if (currentCountryIndex !== null && document.getElementById('view-country-detail').classList.contains('active')) {
      showCountryDetail(currentCountryIndex, true);
    }
  }

  // &#9472;&#9472; MONITOR SELECTOR &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
  /**
   * onMonitorChange() — Responde al cambio del selector de monitoreo en la vista detalle.
   * Si val = 'all', agrega todos los eventos del período activo con buildMatricesForPeriod().
   * Si val = índice numérico, usa solo ese evento específico.
   * Actualiza donut, gráfico de barras y tarjetas de estadísticas.
   * @param {number} beachId - ID de la playa cuyo selector cambió.
   */
  function onMonitorChange(beachId) {
    const sel   = document.getElementById('monitor-sel-' + beachId);
    const label = document.getElementById('monitor-label-' + beachId);
    const b     = DATA.beaches.find(x => x.id === beachId);
    if (!b) return;

    if (!sel) return;
    // ⚠️ CÓDIGO MUERTO: control duplicado — si sel es falsy, ya retornó en la línea anterior.
    if (!sel) return;
    if (!sel) return;
    if (!sel) return;
    const val = sel.value;
    let litter, transect_labels, transect_matrix, station_labels, station_matrix,
        total_items, avg_density;

    if (val === 'all') {
      const _m = buildMatricesForPeriod(b, currentPeriod);
      litter          = _m.litter;
      transect_labels = _m.transect_labels;
      transect_matrix = _m.transect_matrix;
      station_labels  = _m.station_labels;
      station_matrix  = _m.station_matrix;
      total_items     = b.total_items;
      avg_density     = b.avg_density;
    if (label) label.innerHTML = 'Mostrando: acumulado hist&#243;rico (composici&#243;n sumada &middot; densidad promediada)';
    } else {
      const periodEvs = getEventsForPeriod(b, currentPeriod);
      const e = periodEvs[parseInt(val)];
      litter          = e.litter;
      const tLabels   = Object.keys(e.transects).map(t => 'T' + t);
      const sLabels   = Object.keys(e.stations).map(s  => 'S' + s);
      const ltTypes   = FIXED_8;
      transect_labels = tLabels;
      transect_matrix = ltTypes.map(lt => ({
        litter_type: lt,
        data: Object.values(e.transects).map(t => t.litter[lt] ? round4(t.litter[lt] / t.area) : 0)
      }));
      station_labels  = sLabels;
      station_matrix  = ltTypes.map(lt => ({
        litter_type: lt,
        data: Object.values(e.stations).map(s => s.litter[lt] ? round4(s.litter[lt] / s.area) : 0)
      }));
      total_items = e.total;
      avg_density = e.density;
    if (label) label.innerHTML = `Mostrando: ${e.date} &middot; ${e.org||'Sin org'} &middot; ${e.n_units} Estaciones &middot; ${e.area} m&#178;`;
    }

    // Update donut
    makeDoughnut('beach-donut-' + beachId, allLitterKeys(), litterValuesForAllKeys(litter), false, true);
    // Update bar chart
    window['_beach_litter_' + beachId]          = litter;
    window['_beach_transect_labels_' + beachId] = transect_labels;
    window['_beach_transect_matrix_' + beachId] = transect_matrix;
    window['_beach_station_labels_'  + beachId] = station_labels;
    window['_beach_station_matrix_'  + beachId] = station_matrix;
    renderBeachBarFromStore(beachId, window['_beach_bar_mode_' + beachId] || 'station');

    // Update stats
    const densEl  = document.getElementById('beach-stat-density-' + beachId);
    const totalEl = document.getElementById('beach-stat-total-'   + beachId);
    if (densEl)  densEl.textContent  = avg_density.toFixed(3);

  /**
   * setBeachViewMode() — Alterna entre los tres modos de visualización de la vista detalle:
   *   • 'charts' — gráficos principales (donut + barras de estaciones).
   *   • 'grid'   — grilla de donuts por muestreo (renderDonutGrid).
   *   • 'year'   — grilla de donuts agrupados por período (renderDonutGridByYear).
   * @param {number} beachId - ID de la playa.
   * @param {string} mode    - 'charts' | 'grid' | 'year'.
   */
  function setBeachViewMode(beachId, mode) {
    document.getElementById('view-mode-charts-' + beachId).classList.toggle('active', mode === 'charts');
    const yearBtn = document.getElementById('view-mode-year-' + beachId);
    if (yearBtn) yearBtn.classList.toggle('active', mode === 'year');
    document.getElementById('view-mode-grid-'   + beachId).classList.toggle('active', mode === 'grid');
    const topRow = document.getElementById('beach-top-row-' + beachId);
    if (topRow) topRow.style.display = mode === 'charts' ? '' : 'none';
    const statsGeneral = document.getElementById('beach-stats-general-' + beachId);
    if (statsGeneral) statsGeneral.style.display = mode === 'charts' ? 'grid' : 'none';
    const yearGrid = document.getElementById('beach-donut-grid-year-' + beachId);
    if (yearGrid) yearGrid.style.display = mode === 'year' ? '' : 'none';
    document.getElementById('beach-donut-grid-' + beachId).style.display = mode === 'grid'   ? '' : 'none';
    if (mode === 'grid') renderDonutGrid(beachId);
    if (mode === 'year') renderDonutGridByYear(beachId);
  }

  /**
   * renderDonutGrid() — Renderiza la grilla de donuts por muestreo individual.
   * Para cada evento del período activo crea una fila paired (donut + barra de estaciones).
   * Los gráficos se dibujan dentro de un setTimeout(50ms) para esperar al DOM.
   * @param {number} beachId - ID de la playa.
   */
  function renderDonutGrid(beachId) {
    const b   = DATA.beaches.find(x => x.id === beachId);
    const el  = document.getElementById('beach-donut-grid-' + beachId);
    if (!b || !el) return;

    const periodEvs = getEventsForPeriod(b, currentPeriod);

    // All litter types across events in the current period filter
    const allTypes = FIXED_8;

    // Build paired rows (dona + barra por muestreo)
    const rowsHtml = periodEvs.map((e, i) => `
      <div class="paired-row" style="grid-template-rows:auto auto;gap:12px;align-items:start">
        <div>
          <div class="dg-label">${e.date}</div>
          <div class="dg-sub">${e.density.toFixed(3)} ítem/m²</div>
          <div class="dg-wrap"><canvas id="dg-canvas-${beachId}-${i}"></canvas></div>
        </div>
        <div class="chart-wrap"><canvas id="beach-bar-event-${beachId}-${i}"></canvas></div>
        <div style="grid-column:1/-1;display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--gray-200)">
          <div class="stat-card" style="flex:1;padding:8px 12px"><div class="label">Total ítems</div><div class="value">${e.total||0}</div></div>
          <div class="stat-card" style="flex:1;padding:8px 12px"><div class="label">Fecha</div><div class="value" style="font-size:14px;margin-top:2px">${e.date}</div></div>
          <div class="stat-card" style="flex:1;padding:8px 12px"><div class="label">Densidad prom.</div><div class="value" style="color:var(--red)">${e.density.toFixed(3)}</div><div class="sub">ítem/m²</div></div>
        </div>
      </div>`).join('');

    el.innerHTML = `<div class="chart-card">
      <div class="paired-grid">${rowsHtml}</div>
    </div>`;
    // Render each donut after DOM is ready
    setTimeout(() => {
      periodEvs.forEach((e, i) => {
        const ctx = document.getElementById('dg-canvas-' + beachId + '-' + i);
        if (!ctx) return;
        const total = Object.values(e.litter).reduce((a,b)=>a+b,0) || 1;
        const id = 'dg-' + beachId + '-' + i;
        destroyChart(id);
        charts[id] = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: allTypes,
            datasets: [{ data: allTypes.map(lt => e.litter[lt] || 0),
              backgroundColor: allTypes.map(getLitterColor),
              borderWidth: 1.5, borderColor: '#fff' }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '55%',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: c => ` ${c.label}: ${c.parsed} (${(c.parsed/total*100).toFixed(1)}%)` }}
            }
          }
        });
      });
      periodEvs.forEach((e, i) => {
        const barId = 'beach-bar-event-' + beachId + '-' + i;
        if (!document.getElementById(barId)) return;
        const ltTypes = Object.keys(e.litter);
        const sLabels = Object.keys(e.stations).map(s => 'S' + s);
        const sMatrix = ltTypes.map(lt => ({
          litter_type: lt,
          data: Object.values(e.stations).map(s => s.litter[lt] ? round4(s.litter[lt] / s.area) : 0)
        }));
        makeBarStacked(barId, sLabels, sMatrix);
      });
    }, 50);
  }


  /**
   * renderDonutGridByYear() — Renderiza la grilla de donuts agrupados por período (2021 | 2024).
   * Agrupa los eventos filtrados en los dos períodos canónicos y, para cada grupo con datos,
   * muestra un donut con la composición acumulada y una barra de estaciones del período.
   * @param {number} beachId - ID de la playa.
   */
  function renderDonutGridByYear(beachId) {
    const b   = DATA.beaches.find(x => x.id === beachId);
    const el  = document.getElementById('beach-donut-grid-year-' + beachId);
    if (!b || !el) return;

    const periodEvs = getEventsForPeriod(b, currentPeriod);
    const PERIOD_DEFS = [
      { label: '2021-2022', years: ['2021','2022'], displayLabel: '2021' },
      { label: '2024-2025', years: ['2024','2025'], displayLabel: '2024' }
    ];
    const groups = PERIOD_DEFS.map(p => ({
      label: p.label,
      events: periodEvs.filter(e => p.years.includes(getEventYear(e.date)))
    })).filter(g => g.events.length > 0);

    // All litter types across events in the current period filter
    const allTypes = FIXED_8;

    const rowsHtml = groups.map((g, i) => {
      const avgDensity = g.events.reduce((s,e) => s + e.density, 0) / g.events.length;
      const totalItems = g.events.reduce((s,e) => s + (e.total||0), 0);
      return `<div class="paired-row" style="grid-template-rows:auto auto;gap:12px;align-items:start">
        <div>
          <div class="dg-label">${g.label}</div>
          <div class="dg-sub">${avgDensity.toFixed(3)} ítem/m² &middot; ${g.events.length} monitoreos</div>
          <div class="dg-wrap"><canvas id="dgy-canvas-${beachId}-${i}"></canvas></div>
        </div>
        <div class="chart-wrap"><canvas id="beach-bar-year-${beachId}-${i}"></canvas></div>
        <div style="grid-column:1/-1;display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--gray-200)">
          <div class="stat-card" style="flex:1;padding:8px 12px"><div class="label">Total ítems</div><div class="value">${totalItems}</div></div>
          <div class="stat-card" style="flex:1;padding:8px 12px"><div class="label">Monitoreos</div><div class="value">${g.events.length}</div></div>
          <div class="stat-card" style="flex:1;padding:8px 12px"><div class="label">Densidad prom.</div><div class="value" style="color:var(--red)">${avgDensity.toFixed(3)}</div><div class="sub">ítem/m²</div></div>
        </div>
      </div>`;
    }).join('');

    el.innerHTML = `<div class="chart-card">
      <div class="paired-grid">${rowsHtml}</div>
    </div>`;
    setTimeout(() => {
      groups.forEach((g, i) => {
        const ctx = document.getElementById('dgy-canvas-' + beachId + '-' + i);
        if (!ctx) return;
        const litterAgg = {};
        g.events.forEach(e => {
          Object.entries(e.litter).forEach(([k,v]) => { litterAgg[k] = (litterAgg[k]||0) + v; });
        });
        const total = Object.values(litterAgg).reduce((a,b)=>a+b,0) || 1;
        const id = 'dgy-' + beachId + '-' + i;
        destroyChart(id);
        charts[id] = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: allTypes,
            datasets: [{ data: allTypes.map(lt => litterAgg[lt] || 0),
              backgroundColor: allTypes.map(getLitterColor),
              borderWidth: 1.5, borderColor: '#fff' }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '55%',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: c => ` ${c.label}: ${c.parsed} (${(c.parsed/total*100).toFixed(1)}%)` }}
            }
          }
        });
      });
      groups.forEach((g, i) => {
        const barId = 'beach-bar-year-' + beachId + '-' + i;
        if (!document.getElementById(barId)) return;
        const m = buildMatricesForPeriod(b, g.label);
        makeBarStacked(barId, m.station_labels, m.station_matrix);
      });
    }, 50);
  }


  // &#9472;&#9472; BEACH BAR (with stored data for monitor selector) &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
  /**
   * renderBeachBarFromStore() — Dibuja el gráfico de barras de la vista detalle usando
   * datos pre-calculados almacenados en variables globales window['_beach_*'].
   * Permite al toggle transecto/estación redibujar sin recalcular matrices.
   * @param {number} beachId - ID de la playa.
   * @param {string} mode    - 'station' | 'transect'.
   */
  function renderBeachBarFromStore(beachId, mode) {
    window['_beach_bar_mode_' + beachId] = mode;
    const labels = mode === 'transect'
      ? window['_beach_transect_labels_' + beachId]

  // &#9472;&#9472; DOWNLOAD CSV &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
  // Último conjunto de playas resultante de applyGlobalFilters(). Usado por downloadFilteredCSV()
  // para exportar solo los datos actualmente visibles. Array vacío = exportar todo.
  let _lastFiltered = [];

  /**
   * downloadFilteredCSV() — Exporta a CSV los datos de todos los eventos de las playas
   * actualmente filtradas (_lastFiltered) o de todas si no hay filtro activo.
   * Incluye BOM UTF-8 (﻿) para compatibilidad con Excel.
   * El archivo se descarga automáticamente como 'marine_litter_data.csv'.
   */
  function downloadFilteredCSV() {
    const list = _lastFiltered.length ? _lastFiltered : DATA.beaches;
    const LITTER = ['Papers','Cigarette butts','Plastics','Metals','Glass','Face masks','Wood','Worked wood','Natural wood','Algae','Plants','Others'];
    const headers = [
      'Playa','Pa&#237;s','Ciudad','Regi&#243;n','Zona Internacional',
      'Lat','Lng','Fecha','Organizaci&#243;n',
      'N&#176; Estaciones','&#193;rea total (m&#178;)','Total &#237;tems','Densidad (ítem/m²)',
      ...LITTER
    ];
    const rows = [];
    list.forEach(b => {
      b.events.forEach(e => {
        rows.push([
          b.beach, b.country, b.city, b.region, b.zone_intl,
          b.lat, b.lng, e.date, e.org,
          e.n_units, e.area, e.total, e.density,
          ...LITTER.map(lt => e.litter[lt] || 0)
        ]);
      });
    });
    const csv = [headers, ...rows]
      .map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','))
      .join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'marine_litter_data.csv'; a.click();
    URL.revokeObjectURL(url);
  }
  const SVG_BEACH = '&#127958;';
  const SVG_CLIP  = '&#128203;';

  function filterBeachesByIsland(key) {
    const zoneMap = {
      'Rapa Nui':  'Rapa Nui',
      'Galapagos': 'Gal\u00e1pagos'
    };
    const zone = zoneMap[key] || key;
    const filtered = DATA.beaches.filter(b => {
      if (b.zone_intl !== zone) return false;
      if (currentPeriod !== 'all') {
        const years = currentPeriod === '2021-2022' ? ['2021','2022'] : ['2024','2025'];
        return b.events.some(e => years.includes(getEventYear(e.date)));
      }
      return true;
    });

    if (filtered.length === 0) return;

    // Si solo hay una playa, ir directo al detalle
    if (filtered.length === 1) {
      showBeachDetail(filtered[0].id);
      return;
    }

    // Si hay mas de una playa, mostrar lista filtrada
    showView('view-beaches');
    showTab('beaches');
    setTimeout(() => {
      document.getElementById('f-name').value = '';
      document.getElementById('f-country').value = '';
      document.getElementById('f-org').value = '';
      document.getElementById('f-density').value = '';
      filtered.sort((a,b) => a.lat - b.lat);
      const tbody = document.getElementById('beaches-tbody');
      const countEl = document.getElementById('beaches-count');
      if (countEl) countEl.textContent = filtered.length + ' playas';
      if (tbody) tbody.innerHTML = filtered.map(beachTableRowHtml).join('');
    }, 100);
  }
  function renderCountries() {
    const el = document.getElementById('view-countries');
    const countriesSorted = [...DATA.countries].sort((a, b) => {
      const latA = DATA.beaches.find(x => x.country === a.name)?.lat ?? 0;
      const latB = DATA.beaches.find(x => x.country === b.name)?.lat ?? 0;
      return latA - latB;
    });

  // &#9472;&#9472; COUNTRIES VIEW &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
  const cards = countriesSorted.filter(c => {
    return DATA.beaches
      .filter(b => b.country === c.name)
      .some(b => beachMatchesGlobalFilters(b));
  }).map(c => {
      const periods = {
        '2021-2022': { years: ['2021','2022'], beaches: new Set(), events: 0, density: [] },
        '2024-2025': { years: ['2024','2025'], beaches: new Set(), events: 0, density: [] }
      };
      DATA.beaches.filter(b => b.country === c.name).forEach(b => {
        b.events.forEach(e => {
          const year = getEventYear(e.date);
          Object.entries(periods).forEach(([label, p]) => {
            if (p.years.includes(year)) {
              p.beaches.add(b.id);
              p.events++;
              p.density.push(e.density);
            }
          });
        });
      });

      const periodRows = Object.entries(periods)
        .filter(([label]) => currentPeriod === 'all' || label === currentPeriod)
        .map(([label, p]) => {
        if (p.events === 0) return '';
        const avgDensity = (p.density.reduce((a,b) => a+b, 0) / p.density.length).toFixed(3);
        return `
          <div style="margin-bottom:6px;background:var(--green-pale);border-radius:6px;padding:6px 8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <span style="font-size:11px;font-weight:700;color:var(--green)">${label}</span>
              <span style="font-size:12px;font-weight:800;color:var(--green)">${avgDensity} <small style="font-weight:400;color:var(--gray-400)">ítem/m²</small></span>
            </div>
            <div style="display:flex;gap:10px">
              <span style="font-size:11px;color:var(--gray-600)">${SVG_BEACH} ${p.beaches.size} playas</span>
              <span style="font-size:11px;color:var(--gray-600)">${SVG_CLIP} ${p.events} monitoreos</span>
            </div>
          </div>`;
      }).join('');

      const filteredBeaches = DATA.beaches.filter(b => b.country === c.name && beachMatchesGlobalFilters(b));
      const filteredEvents = filteredBeaches.reduce((s,b) => s + getEventsForPeriod(b, currentPeriod).length, 0);

      return `

          <div style="margin-top:10px">${periodRows}</div>
        </div>`;
    }).join('');

    // Tarjetas insulares
    const ISLANDS = [
      { key: 'Rapa Nui', flag: '<img src="https://cientificosdelabasura.ucn.cl/wp-content/uploads/2026/05/rapa_nui_preview.png" width="36" height="36" style="object-fit:contain">', name: 'Rapa Nui',       badge: 'Isla \u00b7 Chile',   zoneVal: 'Rapa Nui'   },
      { key: 'Galapagos', flag: '<img src="https://cientificosdelabasura.ucn.cl/wp-content/uploads/2026/05/galapagos_preview.png" width="36" height="36" style="object-fit:contain">', name: 'Gal\u00e1pagos', badge: 'Isla \u00b7 Ecuador', zoneVal: 'Gal\u00e1pagos'}
    ];

    const islandCards = ISLANDS.map(isl => {
      const islandBeaches = DATA.beaches.filter(b => 
        b.zone_intl === isl.zoneVal && beachMatchesGlobalFilters(b)
      );
      if (!islandBeaches.length) return '';

      const periodRows = Object.entries({
        '2021-2022': { years: ['2021','2022'], beaches: new Set(), events: 0, density: [] },
        '2024-2025': { years: ['2024','2025'], beaches: new Set(), events: 0, density: [] }
      }).filter(([label]) => currentPeriod === 'all' || label === currentPeriod)
        .map(([label, p]) => {
          islandBeaches.forEach(b => {
            b.events.forEach(e => {
              if (p.years.includes(getEventYear(e.date))) {
                p.beaches.add(b.id);
                p.events++;
                p.density.push(e.density);
              }
            });
          });
          if (p.events === 0) return '';
          const avg = (p.density.reduce((a,b) => a+b, 0) / p.density.length).toFixed(3);
          return `<div style="margin-bottom:6px;background:var(--green-pale);border-radius:6px;padding:6px 8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <span style="font-size:11px;font-weight:700;color:var(--green)">${label}</span>

            </div>

      const totalEvents = islandBeaches.reduce((s,b) => s + b.events.length, 0);
      return `
        <div class="country-card" onclick="filterBeachesByIsland('${isl.key}')" style="cursor:pointer;background:linear-gradient(135deg,#f0f7f0 60%,#e8f5e9 100%);border:1.5px solid var(--green);position:relative">

          <div style="margin-top:10px">${periodRows}</div>
        </div>`;
    }).join('');

    const islandSection = islandCards.trim() ? islandCards : '';

    el.innerHTML = `<div class="country-grid">${cards}${islandSection}</div>`;
  }

  // &#9472;&#9472; BEACHES VIEW &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;

  let _beachesFiltered = [];
  const BEACH_PAGE = 10;
  let _beachSortCol = null;
  let _beachSortDir = 0;

  function beachTableRowHtml(b) {
    const periodEvents  = getEventsForPeriod(b, currentPeriod);
    const periodDensity = getBeachDensityForPeriod(b, currentPeriod);
    return '<tr>' +
      '<td><span class="link-btn" onclick="showBeachDetail(' + b.id + ')">' + b.beach + '</span></td>' +
      '<td>' + b.country + '</td>' +
      '<td>' + (b.city||'&#8212;') + '</td>' +
      '<td>' + periodEvents.length + '</td>' +
      '<td>' + (periodDensity != null ? periodDensity.toFixed(3) : '&#8212;') + '</td>' +
      '</tr>';
  }


  function sortBeachesTable(col) {
    const thIds = { name:'bth-name', country:'bth-country', city:'bth-city', events:'bth-events', density:'bth-density' };
    if (_beachSortCol === col) {
      _beachSortDir = _beachSortDir === 1 ? -1 : 1;
    } else {
      _beachSortCol = col;
      _beachSortDir = 1;
    }
    Object.entries(thIds).forEach(([k, id]) => {
      const th = document.getElementById(id);
      if (!th) return;
      const arrow = th.querySelector('.sort-arrow');
      if (!arrow) return;
      arrow.textContent = k === col ? (_beachSortDir === 1 ? ' ↑' : ' ↓') : '';
      th.dataset.dir = k === col ? _beachSortDir : '';
    });
    _beachesFiltered.sort((a, b) => {
      let va, vb;
      if (col === 'name')    { va = a.beach.toLowerCase();   vb = b.beach.toLowerCase(); }
      if (col === 'country') { va = a.country.toLowerCase(); vb = b.country.toLowerCase(); }
      if (col === 'city')    { va = (a.city||'').toLowerCase(); vb = (b.city||'').toLowerCase(); }
      if (col === 'events')  { va = getEventsForPeriod(a, currentPeriod).length; vb = getEventsForPeriod(b, currentPeriod).length; }
      if (col === 'density') {
        va = getBeachDensityForPeriod(a, currentPeriod) ?? -1;
        vb = getBeachDensityForPeriod(b, currentPeriod) ?? -1;
      }
      if (va < vb) return -1 * _beachSortDir;
      if (va > vb) return  1 * _beachSortDir;
      return 0;
    });
    const expanded = document.getElementById('beaches-main-more')?.dataset.expanded === '1';
    renderBeachRows(expanded ? _beachesFiltered : _beachesFiltered.slice(0, BEACH_PAGE));
  }

  function renderBeachRows(list) {
    const tbody = document.getElementById('beaches-tbody');
    if (!tbody) return;
    tbody.innerHTML = list.map(beachTableRowHtml).join('');
  }
  function filterBeaches() {
    const filtered = DATA.beaches.filter(b => beachMatchesGlobalFilters(b));
    filtered.sort((a, b) => a.lat - b.lat);

    const countEl = document.getElementById('beaches-count');
    if (countEl) countEl.textContent = filtered.length + ' playas';

    const tbody = document.getElementById('beaches-tbody');
    if (!tbody) return;

    // Store for CSV download
    _lastFiltered = filtered;

    _beachesFiltered = filtered;

    // Remove old show-more btn if exists
    const oldBtn = document.getElementById('beaches-main-more');
    if (oldBtn) oldBtn.remove();

    renderBeachRows(filtered.slice(0, BEACH_PAGE));

    if (filtered.length > BEACH_PAGE) {
      const moreBtn = document.createElement('button');
      moreBtn.className = 'mlm-show-more';
      moreBtn.id = 'beaches-main-more';
      moreBtn.innerHTML = `Ver ${filtered.length - BEACH_PAGE} playas más ↓`;
      moreBtn.dataset.expanded = '0';
      moreBtn.onclick = function() {
        if (this.dataset.expanded === '1') {
          renderBeachRows(_beachesFiltered.slice(0, BEACH_PAGE));
          this.innerHTML = `Ver ${_beachesFiltered.length - BEACH_PAGE} playas más ↓`;
          this.dataset.expanded = '0';
        } else {
          renderBeachRows(_beachesFiltered);
          this.innerHTML = 'Ver menos &#8593;';
          this.dataset.expanded = '1';
        }
      };
      tbody.parentElement.parentElement.appendChild(moreBtn);
    }
  }

  function filterCountryBeaches(slug) {
    const name    = (document.getElementById('cf-name-' + slug)?.value||'').toLowerCase();
    const org     = document.getElementById('cf-org-' + slug)?.value||'';
    const density = parseFloat(document.getElementById('cf-density-' + slug)?.value||0)||0;
    const data    = _countryDetailData[slug];
    if (!data) return;

    let filtered = data.beaches.filter(b => {
      if (!beachMatchesGlobalFilters(b)) return false;
      if (name && !b.beach.toLowerCase().includes(name)) return false;
      if (density && b.avg_density < density) return false;
      if (org && !b.events.some(e => e.org === org)) return false;
      return true;
    });

    filtered.sort((a,b) => a.lat - b.lat);
    const tbody = document.getElementById('beaches-tbody-' + slug);
    if (!tbody) return;
    tbody.innerHTML = filtered.map(b =>
      '<tr><td><span class="link-btn" onclick="showBeachDetail(' + b.id + ')">' + b.beach + '</span></td>' +
      '<td>' + (b.city||'&#8212;') + '</td><td>' + b.n_events + '</td>' +
      '<td>' + b.avg_density.toFixed(3) + '</td>' +
    '<tr>').join('');
    const countEl = document.getElementById('cf-count-' + slug);
    if (countEl) countEl.textContent = filtered.length + ' playas';
  }


  function renderCountryBarWithStickyAxis(canvasId, beachesSorted, densities, clickPeriod) {
    const isMobile        = window.innerWidth < 600;
    const Y_AXIS_WIDTH    = isMobile ? 75 : 110;
    const MAX_LABEL_CHARS = isMobile ? 9 : 14;
    const ROW_H           = 28;
    const beachLabels     = beachesSorted.map(b => b.beach);
    const chartHeight     = Math.max(200, beachLabels.length * ROW_H + 40);

    const rawMaxDensity = Math.max(...densities, 0);
    let maxDensity;
    if (rawMaxDensity <= 0) {
      maxDensity = 1;
    } else {
      const padded = rawMaxDensity * 1.08;
      const step   = padded <= 5 ? 0.5 : padded <= 10 ? 1 : padded <= 50 ? 5 : 10;
      maxDensity   = Math.ceil(padded / step) * step;
    }

    const canvasEl = document.getElementById(canvasId);
    if (!canvasEl) return;
    const chartWrap = canvasEl.parentElement;
    chartWrap.style.height    = chartHeight + 'px';
    chartWrap.style.maxHeight = '420px';
    chartWrap.style.overflowY = 'auto';
    chartWrap.style.overflowX = 'hidden';

    const axisStickyWrap = document.createElement('div');
    axisStickyWrap.style.position   = 'sticky';
    axisStickyWrap.style.top        = '0px';
    axisStickyWrap.style.zIndex     = '2';
    axisStickyWrap.style.height     = '42px';
    axisStickyWrap.style.background = 'var(--white)';
    axisStickyWrap.style.display    = 'flex';
    axisStickyWrap.style.flexDirection = 'column';
    const axisTitleEl = document.createElement('div');
    axisTitleEl.textContent = 'Densidad (ítem/m²)';
    axisTitleEl.style.cssText = 'font-size:13px;color:#333;text-align:center;flex-shrink:0;';
    axisStickyWrap.appendChild(axisTitleEl);
    const axisCanvas = document.createElement('canvas');
    axisCanvas.id = canvasId + '-axis';
    axisStickyWrap.appendChild(axisCanvas);
    chartWrap.insertBefore(axisStickyWrap, chartWrap.firstChild);

    const innerWrap = document.createElement('div');
    innerWrap.style.position = 'relative';
    innerWrap.style.height   = chartHeight + 'px';
    canvasEl.parentElement.insertBefore(innerWrap, canvasEl);
    innerWrap.appendChild(canvasEl);
    destroyChart(canvasId);
    destroyChart(canvasId + '-axis');

    charts[canvasId] = new Chart(canvasEl, {
      type: 'bar',
      data: {
        labels: beachLabels,
        datasets: [{ label: 'Densidad (ítem/m²)', data: densities,
          backgroundColor: densities.map(d => densityColor(d)), borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { min: 0, max: maxDensity, ticks: { font: { size: 10 } }, title: { display: false } },
          y: { ticks: { font: { size: 11 }, autoSkip: false, cursor: 'pointer',
                callback: function(value) {
                  const label = this.getLabelForValue(value);
                  return label.length > MAX_LABEL_CHARS ? label.slice(0, MAX_LABEL_CHARS - 1) + '…' : label;
                } },
               afterFit: scale => { scale.width = Y_AXIS_WIDTH; } }
        },
        onClick(evt, elements) {
          if (!elements.length) return;
          const beach = beachesSorted[elements[0].index];
          if (!beach) return;
          if (clickPeriod) {
            currentPeriod = clickPeriod;
            document.querySelectorAll('#mlm-sidebar .period-btn').forEach(btn => {
              btn.classList.toggle('active', btn.dataset.period === clickPeriod);
            });
          }
          showBeachDetail(beach.id);
        },
        onHover(evt, elements) {
          evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
        }
      }
    });

    charts[canvasId + '-axis'] = new Chart(axisCanvas, {
      type: 'bar',
      data: { labels: [''], datasets: [{ data: [0], backgroundColor: 'transparent', borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        layout: { padding: { bottom: 8 } },
        animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { min: 0, max: maxDensity, grid: { display: false }, ticks: { font: { size: 10 }, mirror: true  }, title: { display: false } },
          y: { display: true, ticks: { display: false }, grid: { display: false },
               border: { display: false }, afterFit: scale => { scale.width = Y_AXIS_WIDTH; } }
        }
      }
    });
  }

  function renderCountryByYear(slug, beaches) {
    const el = document.getElementById('country-charts-year-' + slug);
    if (!el) return;

    const PERIOD_DEFS = [
      { label: '2021-2022', years: ['2021','2022'], displayLabel: '2021' },
      { label: '2024-2025', years: ['2024','2025'], displayLabel: '2024' }
    ];
    const groups = PERIOD_DEFS.map(p => ({
      label: p.label,
      displayLabel: p.displayLabel,
      events: beaches.flatMap(b => getEventsForPeriod(b, p.label))
    })).filter(g => g.events.length > 0);

    const rowsHtml = groups.map((g, i) => {
      const gAvgDensity = g.events.length
        ? (g.events.reduce((s,e) => s + e.density, 0) / g.events.length).toFixed(3)
        : '0.000';
      const gTotalItems = g.events.reduce((s,e) => s + (e.total||0), 0);
      const gBeaches    = new Set(beaches.filter(b => getEventsForPeriod(b, g.label).length > 0).map(b => b.id)).size;
      const gOrgs       = new Set(g.events.map(e => e.org).filter(Boolean)).size;
      return `<div class="chart-card" style="margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;text-align:center;color:var(--gray-600)">${g.displayLabel||g.label}</div>
        <div class="country-year-inner" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:16px;min-width:0">
          <div style="min-width:0">${countryStatsInlineHtml(gAvgDensity, gTotalItems.toLocaleString('es'), gBeaches, g.events.length, gOrgs)}</div>
          <div style="position:relative;height:280px;margin-top:16px;min-width:0"><canvas id="country-donut-year-${slug}-${i}"></canvas></div>
        </div>
        <div class="chart-wrap-tall"><canvas id="country-bar-year-${slug}-${i}"></canvas></div>
      </div>`;
    }).join('');

    el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px">${rowsHtml}</div>`;
    setTimeout(() => {
      groups.forEach((g, i) => {
        const litterAgg = {};
        g.events.forEach(e => {
          Object.entries(e.litter).forEach(([k,v]) => { litterAgg[k] = (litterAgg[k]||0) + v; });
        });
        makeDoughnut('country-donut-year-' + slug + '-' + i, FIXED_8, FIXED_8.map(k => litterAgg[k]||0), false, true);

        const beachesWithData = beaches.filter(b => getEventsForPeriod(b, g.label).length > 0);
        const sorted = [...beachesWithData].sort((a, b) => {
          const da = getBeachDensityForPeriod(a, g.label) || 0;
          const db = getBeachDensityForPeriod(b, g.label) || 0;
          return db - da;
        });
        const densities = sorted.map(b => getBeachDensityForPeriod(b, g.label) || 0);
        renderCountryBarWithStickyAxis('country-bar-year-' + slug + '-' + i, sorted, densities, g.label);
        });
    }, 50);
  }

  function setCountryView(slug, mode) {
    const generalBtn = document.getElementById('country-view-general-' + slug);
    const yearBtn    = document.getElementById('country-view-year-' + slug);
    if (generalBtn) generalBtn.classList.toggle('active', mode === 'general');
    if (yearBtn)    yearBtn.classList.toggle('active',    mode === 'year');
    const generalEl = document.getElementById('country-charts-general-' + slug);
    const yearEl    = document.getElementById('country-charts-year-' + slug);
    if (generalEl) generalEl.style.display = mode === 'general' ? 'grid' : 'none';
    if (yearEl)    yearEl.style.display    = mode === 'year'    ? '' : 'none';
    if (mode === 'year') {
      const beaches = DATA.beaches.filter(b => {
        const c = DATA.countries.find(x => slugify(x.name) === slug);
        return c && decodeHTML(b.country) === c.name;
      });
      renderCountryByYear(slug, beaches);
    }
  }

  function sortCountryOrgTable(slug, col) {
    const d = _countryDetailData[slug];
    if (!d) return;
    if (d.orgSortCol === col) {
      d.orgSortDir = -(d.orgSortDir || 1);
    } else {
      d.orgSortCol = col;
      d.orgSortDir = 1;
    }
    const sorted = [...d.orgRows].sort((a, b) => {
      if (col === 'org') {
        return d.orgSortDir * a.org.localeCompare(b.org);
      }
      if (col === 'beaches') return d.orgSortDir * (a.nBeaches - b.nBeaches);
      if (col === 'events')  return d.orgSortDir * (a.nEvents  - b.nEvents);
      return 0;
    });
    const tbody = document.getElementById('inst-tbody-' + slug);
    const moreBtn = document.getElementById('inst-more-' + slug);
    const isExpanded = moreBtn && moreBtn.textContent.includes('menos');
    const toShow = isExpanded ? sorted : sorted.slice(0, 5);
    if (tbody) tbody.innerHTML = toShow.map(orgTableRowHtml).join('');
    ['org','beaches','events'].forEach(c => {
      const th = document.getElementById('th-org-' + c + '-' + slug);
      if (th) th.dataset.dir = (c === col) ? (d.orgSortDir === 1 ? 'asc' : 'desc') : '';

  }

  function buildOrgRows(beaches) {
    const orgMap = {};
    beaches.forEach(b => {
      getEventsForPeriod(b, currentPeriod).forEach(e => {
        if (!e.org) return;
        if (!orgMap[e.org]) orgMap[e.org] = { beachIds: new Set(), count: 0 };
        orgMap[e.org].beachIds.add(b.id);
        orgMap[e.org].count++;
      });
    });
    return Object.keys(orgMap).sort().map(o => ({
      org: o, nBeaches: orgMap[o].beachIds.size, nEvents: orgMap[o].count
    }));
  }

  function orgTableRowHtml(o) {
    return '<tr><td>' + o.org + '</td><td>' + o.nBeaches + '</td><td>' + o.nEvents + '</td></tr>';
  }

  function sortCountryBeachTable(slug, col) {
    const d = _countryDetailData[slug];
    if (!d) return;
    if (d.sortCol === col) {
      d.sortDir = -(d.sortDir || 1);
    } else {
      d.sortCol = col;
      d.sortDir = 1;
    }
    const sorted = [...d.beaches].sort((a, b) => {
      let va, vb;
      if (col === 'name') {
        va = a.beach.toLowerCase(); vb = b.beach.toLowerCase();
        return d.sortDir * va.localeCompare(vb);
      }

      if (col === 'city') {
        va = (a.city||'').toLowerCase(); vb = (b.city||'').toLowerCase();
        return d.sortDir * va.localeCompare(vb);
      }

      if (col === 'monitors') {
        va = getEventsForPeriod(a, currentPeriod).length;
        vb = getEventsForPeriod(b, currentPeriod).length;
      }
      if (col === 'density') {
        va = getBeachDensityForPeriod(a, currentPeriod) || 0;
        vb = getBeachDensityForPeriod(b, currentPeriod) || 0;
      }
      return d.sortDir * (va - vb);
    });
    d.sortedBeaches = sorted;
    const tbody = document.getElementById('beaches-tbody-' + slug);
    const moreBtn = document.getElementById('beaches-more-' + slug);

      const th = document.getElementById('th-' + c + '-' + slug);

    });
  }

  function maxStacked(datasets) {
    if (!datasets.length) return 10;
    const n = Math.max(...datasets.map(d => d.data.length));
    let max = 0;
    for (let i = 0; i < n; i++) {
      const col = datasets.reduce((sum, d) => sum + (d.data[i] || 0), 0);
      if (col > max) max = col;
    }
    return max || 10;
  }

  function getLitterForPeriods(country, periods) {
    const beaches = DATA.beaches.filter(b => b.country === country.name);
    const litter = {};
    beaches.forEach(b => {
      b.events.forEach(e => {
        const y = e.date ? e.date.slice(-4) : '';
        const p = (y==='2021'||y==='2022') ? '2021-2022' : '2024-2025';
        if (!periods.includes(p)) return;
        Object.entries(e.litter||{}).forEach(([k,v]) => { litter[k] = (litter[k]||0) + v; });
      });
    });
    return litter;
  }

  function getStatsForPeriods(country, periods) {
    const beaches = DATA.beaches.filter(b => b.country === country.name);
    const events = beaches.flatMap(b => b.events.filter(e => {
      const y = e.date ? e.date.slice(-4) : '';
      const p = (y==='2021'||y==='2022') ? '2021-2022' : '2024-2025';
      return periods.includes(p);
    }));
    const beachSet = new Set(beaches.filter(b => b.events.some(e => {
      const y = e.date ? e.date.slice(-4) : '';
      const p = (y==='2021'||y==='2022') ? '2021-2022' : '2024-2025';
      return periods.includes(p);
    })).map(b => b.id));
    const orgs = new Set(events.map(e => e.org).filter(Boolean));
    const avgDensity = events.length ? (events.reduce((s,e) => s+e.density,0)/events.length).toFixed(3) : '0.000';
    const totalItems = events.reduce((s,e) => s+(e.total||0), 0);
    return { avgDensity, totalItems, nBeaches: beachSet.size, nEvents: events.length, nOrgs: orgs.size };
  }

  function updateCountryComparator(countryName, updatedSide) {

    }

    const other = DATA.countries.find(x => x.name === otherName);
    if (!other) return;

    const selfPeriods  = getCmpSidePeriods(slugId, 'self');
    const otherPeriods = getCmpSidePeriods(slugId, 'other');
    const selfCountry  = DATA.countries.find(x => slugify(x.name) === slugId);

    }
    const nameEl = document.getElementById('cmp-country-other-name-' + slugId);
    if (nameEl) nameEl.textContent = other.name;

    // Self donut with period filter

    // Other donut with period filter

      }

      // Other stats with period filter

      if (statsEl) {
        const st = getStatsForPeriods(other, otherPeriods);
        statsEl.innerHTML = countryStatsInlineHtml(st.avgDensity, st.totalItems.toLocaleString('es'), st.nBeaches, st.nEvents, st.nOrgs);
